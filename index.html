<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawnn — لون | Coming Soon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #fffcf4; /* New off-white */
            color: #21326c; /* New dark blue */
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Subtle dot pattern background */
        .bg-pattern {
            position: absolute;
            inset: 0;
            z-index: -1;
            background-image: radial-gradient(#21326c 0.7px, transparent 0.7px);
            background-size: 30px 30px;
            opacity: 0.1;
        }
        /* Top right / Bottom left glowing orbs */
        .glow-1 {
            position: absolute;
            top: -10%; right: -10%;
            width: 400px; height: 400px;
            background: #21326c;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.05;
            z-index: -1;
        }
        .glow-2 {
            position: absolute;
            bottom: -10%; left: -10%;
            width: 300px; height: 300px;
            background: #ff9044;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.1;
            z-index: -1;
        }
        .container {
            padding: 2rem;
            max-width: 800px;
            animation: fadeIn 1s ease-out forwards;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }
        .logo-icon {
            width: 50px;
            height: 50px;
            background-color: #21326c;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(33, 50, 108, 0.3);
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }
        .logo-arabic {
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 1.1rem;
            color: #21326c;
            margin-left: 6px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 900;
            margin: 0 0 1.5rem 0;
            line-height: 1.1;
        }
        h1 em {
            color: #ff9044; /* New orange */
            font-style: italic;
        }
        p {
            font-size: 1.25rem;
            color: #21326c;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto 3rem auto;
            line-height: 1.6;
        }
        .pulse-ring {
            width: 12px;
            height: 12px;
            background-color: #ff9044;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border: 2px solid #ff9044;
            border-radius: 50%;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.75rem; }
            p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path>
                </svg>
            </div>
            <div style="display: flex; align-items: baseline;">
                <span class="logo-text">Lawnn</span>
                <span class="logo-arabic">لون</span>
            </div>
        </div>

        <h1>Something <em>special</em><br>is coming.</h1>
        <p>We are building the premier platform for Egyptian creative talent. Architecture, design, and fine arts — reimagined.</p>
        
        <div class="pulse-ring"></div>
    </div>
</body>
</html>
